name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bill-service:
    name: bill-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bill_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/bill_service/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-fail-under=70
      - run: pip-audit -r requirements.txt
      - run: docker build -t bill-service:ci .

  split-service:
    name: split-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/split_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/split_service/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: coverage run --source=split_app -m unittest discover -s tests
      - run: coverage report --fail-under=70
      - run: pip-audit -r requirements.txt
      # TODO: enable once the Split Service Dockerfile is on main
      # - run: docker build -t split-service:ci .

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}